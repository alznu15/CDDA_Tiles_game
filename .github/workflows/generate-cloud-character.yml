name: Acquire final CC0 character GLB

on:
  push:
    paths:
      - ".github/workflows/generate-cloud-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-character
  cancel-in-progress: true

jobs:
  acquire-character:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch 74-joint CC0 third-person scout
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL="https://cdn.3dassets.dev/assets/32901/v1/model.glb"
          SOURCE_PAGE="https://3dassets.dev/assets/gorgehold-survivor-gallery-and-operations-gorgehold-sc-5418288a"

          mkdir -p web/assets/player
          rm -f web/assets/player/CDDA_SciFi_Soldier_Generated.glb
          rm -f web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

          curl -fL --retry 6 --retry-all-errors --retry-delay 2             "$SOURCE_URL"             -o web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          test -s web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          SIZE_BYTES="$(wc -c < web/assets/player/CDDA_SciFi_Soldier_Generated.glb)"
          echo "Cloud character size: $SIZE_BYTES bytes"

          if [ "$SIZE_BYTES" -lt 1000000 ]; then
            echo "Character GLB is unexpectedly small; refusing to ship."
            exit 1
          fi

          jq -n             --arg source "3DAssets.dev Gorgehold Scout"             --arg sourcePage "$SOURCE_PAGE"             --arg sourceUrl "$SOURCE_URL"             '{
              source: $source,
              sourcePage: $sourcePage,
              sourceUrl: $sourceUrl,
              sourceLicense: "CC0 1.0 Universal",
              skeleton: "74-joint",
              animations: ["idle","walk","run","grasp"],
              notes: "Cloud-acquired, self-contained GLB. No extra decoder required."
            }' > web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

      - name: Commit final character asset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A web/assets/player/CDDA_SciFi_Soldier_Generated.glb
          git add -A web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

          git commit -m "chore(character): install CC0 74-joint scout GLB"
          git push
