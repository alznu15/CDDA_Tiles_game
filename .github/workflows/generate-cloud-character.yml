name: Acquire cloud character GLB

on:
  push:
    paths:
      - ".github/cloud-character.prompt"
      - ".github/workflows/generate-cloud-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-character
  cancel-in-progress: true

jobs:
  acquire-character:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find redistributable rigged sci-fi character through three.ws
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying three.ws public character catalog..."
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
            "https://three.ws/api/catalog?q=sci+fi&kind=character&limit=100" \
            -o /tmp/catalog.json

          echo "Catalog returned:"
          jq '.items[] | {id,title,license,tags,url}' /tmp/catalog.json

          MODEL_JSON="$(jq -c '
            .items[]
            | select(
                ((.license // "")
                  | test("^(CC0|CC0 1\.0|CC-BY-4\.0|CC-BY|Apache-2\.0|MIT)$"; "i"))
              )
            | select(
                (
                  ((.title // "") + " " + ((.tags // []) | join(" ")))
                  | test("sci|soldier|tactical|military|space|combat|armor|robot"; "i")
                )
              )
            | {id,title,license,url,tags}
          ' /tmp/catalog.json | head -n 1)"

          if [ -z "$MODEL_JSON" ]; then
            echo "No redistributable sci-fi character was found."
            echo "Refusing to ship a character with an incompatible/unclear license."
            exit 1
          fi

          echo "Selected catalog item:"
          echo "$MODEL_JSON"

          MODEL_URL="$(jq -r '.url' <<<"$MODEL_JSON")"
          MODEL_ID="$(jq -r '.id' <<<"$MODEL_JSON")"
          MODEL_TITLE="$(jq -r '.title' <<<"$MODEL_JSON")"
          MODEL_LICENSE="$(jq -r '.license' <<<"$MODEL_JSON")"

          if ! printf '%s\n' "$MODEL_URL" | grep -Eq '^https://.*\\.glb([?#].*)?$'; then
            echo "Selected asset does not expose a direct HTTPS GLB URL."
            exit 1
          fi

          mkdir -p web/assets/player

          # Remove the previous Mixamo-derived file from the current branch.
          rm -f web/assets/player/CDDA_SciFi_Soldier_Generated.glb
          rm -f web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

          echo "Downloading $MODEL_URL"
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "$MODEL_URL" \
            -o web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          test -s web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          SIZE_BYTES="$(wc -c < web/assets/player/CDDA_SciFi_Soldier_Generated.glb)"
          echo "Selected GLB size: $SIZE_BYTES bytes"

          if [ "$SIZE_BYTES" -lt 100000 ]; then
            echo "Selected GLB is implausibly small; refusing to commit it."
            exit 1
          fi

          jq -n \
            --arg source "three.ws public character catalog" \
            --arg id "$MODEL_ID" \
            --arg title "$MODEL_TITLE" \
            --arg license "$MODEL_LICENSE" \
            --arg url "$MODEL_URL" \
            '{
              source: $source,
              id: $id,
              title: $title,
              license: $license,
              sourceUrl: $url
            }' > web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

      - name: Commit character asset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A web/assets/player/CDDA_SciFi_Soldier_Generated.glb
          git add -A web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

          if git diff --cached --quiet; then
            echo "Character asset is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "chore(character): use redistributable cloud character"
          git push
