name: Acquire cloud character GLB

on:
  push:
    paths:
      - ".github/cloud-character.prompt"
      - ".github/workflows/generate-cloud-character.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-character
  cancel-in-progress: true

jobs:
  acquire-character:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find a rigged sci-fi character through three.ws catalog API
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying three.ws public character catalog..."
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
            "https://three.ws/api/catalog?q=sci+fi+soldier&kind=character&limit=30" \
            -o /tmp/catalog.json

          echo "Catalog response:"
          cat /tmp/catalog.json

          MODEL_URL="$(jq -r '
            .items[]
            | select(
                (
                  ((.title // "") + " " + ((.tags // []) | join(" ")))
                  | test("sci|soldier|tactical|military|space|combat"; "i")
                )
              )
            | .url
          ' /tmp/catalog.json | grep -E '^https://.*(glb)([?#].*)?$' | head -n 1 || true)"

          if [ -z "$MODEL_URL" ]; then
            MODEL_URL="$(jq -r '.items[]?.url // empty' /tmp/catalog.json | grep -E '^https://.*(glb)([?#].*)?$' | head -n 1 || true)"
          fi

          if [ -z "$MODEL_URL" ]; then
            echo "No usable GLB URL found in the public character catalog."
            exit 1
          fi

          echo "Selected model: $MODEL_URL"

          MODEL_ID="$(jq -r '
            .items[]
            | select(.url == $URL)
            | .id
          ' --arg URL "$MODEL_URL" /tmp/catalog.json | head -n 1 || true)"

          MODEL_TITLE="$(jq -r '
            .items[]
            | select(.url == $URL)
            | .title
          ' --arg URL "$MODEL_URL" /tmp/catalog.json | head -n 1 || true)"

          MODEL_LICENSE="$(jq -r '
            .items[]
            | select(.url == $URL)
            | .license
          ' --arg URL "$MODEL_URL" /tmp/catalog.json | head -n 1 || true)"

          mkdir -p web/assets/player

          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "$MODEL_URL" \
            -o web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          test -s web/assets/player/CDDA_SciFi_Soldier_Generated.glb

          SIZE_BYTES="$(wc -c < web/assets/player/CDDA_SciFi_Soldier_Generated.glb)"
          echo "Selected GLB size: $SIZE_BYTES bytes"

          if [ "$SIZE_BYTES" -lt 100000 ]; then
            echo "Selected GLB is implausibly small; refusing to commit it."
            exit 1
          fi

          jq -n \
            --arg source "three.ws public character catalog" \
            --arg id "$MODEL_ID" \
            --arg title "$MODEL_TITLE" \
            --arg license "$MODEL_LICENSE" \
            --arg url "$MODEL_URL" \
            '{
              source: $source,
              id: $id,
              title: $title,
              license: $license,
              sourceUrl: $url
            }' > web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

      - name: Commit character asset
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/assets/player/CDDA_SciFi_Soldier_Generated.glb
          git add web/assets/player/CDDA_SciFi_Soldier_Generated.metadata.json

          if git diff --cached --quiet; then
            echo "Character asset is unchanged; nothing to commit."
            exit 0
          fi

          git commit -m "chore(character): add cloud-acquired rigged sci-fi GLB"
          git push
