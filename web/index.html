<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>CDDA Tiles — Clean 3D Rebuild</title>
  <link rel="stylesheet" href="./style.css?v=rebuild-1">
</head>
<body>
  <div id="hud">
    <div class="brand">CDDA TILES <span>CLEAN 3D REBUILD</span></div>
    <div class="controls"><b>W A S D</b> MOVE &nbsp; <b>SHIFT</b> SPRINT &nbsp; <b>SPACE</b> JUMP &nbsp; <b>MOUSE</b> LOOK</div>
  </div>
  <div id="crosshair"></div>
  <div id="inputDiag" aria-label="Keyboard input diagnostic"></div>
  <div id="status"></div>
  <div id="boot" class="overlay">

      <div class="kicker">CLEAN REBUILD 01</div>

      <div id="loading">Preparing scene…</div>
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./main.js?v=rebuild-9"></script>
