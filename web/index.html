<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>CDDA Tiles — 3D Movement Prototype</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div class="brand">CDDA TILES <span>3D MOVEMENT PROTOTYPE</span></div>
    <div class="controls">
      <span><b>W A S D</b> move</span>
      <span><b>SHIFT</b> sprint</span>
      <span><b>MOUSE</b> camera</span>
      <span><b>ESC</b> release cursor</span>
    </div>
  </div>

  <div id="boot" class="overlay">
    <div class="boot-card">
      <div class="boot-kicker">PROTOTYPE 01</div>
      <h1>Frontier District</h1>
      <p>Third-person traversal test. No weapons yet — just movement, animation and a real 3D neighborhood.</p>
      <button id="start">ENTER WORLD</button>
      <div class="boot-note">Desktop keyboard + mouse recommended</div>
    </div>
  </div>

  <div id="status" aria-live="polite"></div>
  <div id="crosshair"><i></i></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
